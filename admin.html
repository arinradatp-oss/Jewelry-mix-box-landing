<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ระบบจัดการหลังร้าน - Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="shop-container" style="max-width: 900px;">
        <div class="shop-header">
            <p class="handwritten">Admin Dashboard</p>
            <h1>รายการคำสั่งซื้อทั้งหมด</h1>
        </div>

        <div style="background: var(--card-bg); padding: 20px; border-radius: 12px; border: 1px solid var(--border-color); overflow-x: auto;">
            <table class="price-table" style="width: 100%;">
                <thead>
                    <tr>
                        <th>เวลา</th>
                        <th>ขนาดกล่อง</th>
                        <th>หมวดสินค้า</th>
                        <th>ยอดชำระ (บาท)</th>
                    </tr>
                </thead>
                <tbody id="orderTableBody">
                    <tr>
                        <td colspan="4" style="text-align: center; padding: 20px;">กำลังโหลดข้อมูลจาก Google Sheet...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // แทนที่ด้วย Web App URL ของ Google Apps Script ที่ดึงข้อมูลจาก Google Sheet เป็น JSON
        const googleSheetApiUrl = "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_GET";

        async function fetchOrders() {
            try {
                const response = await fetch(googleSheetApiUrl);
                const data = await response.json();
                
                const tbody = document.getElementById('orderTableBody');
                tbody.innerHTML = '';

                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; padding: 20px;">ยังไม่มีข้อมูลคำสั่งซื้อ</td></tr>';
                    return;
                }

                data.forEach(row => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${row.timestamp || '-'}</td>
                        <td>${row.size || '-'}</td>
                        <td>${row.categories || '-'}</td>
                        <td>${Number(row.totalPrice).toFixed(2)}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                console.error('Error fetching data:', error);
                document.getElementById('orderTableBody').innerHTML = '<tr><td colspan="4" style="text-align: center; color: #a94442; padding: 20px;">ไม่สามารถโหลดข้อมูลได้ กรุณาตรวจสอบ URL หรือสิทธิ์การเข้าถึง</td></tr>';
            }
        }

        fetchOrders();
    </script>
</body>
</html>
