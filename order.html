<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>สั่งซื้อสินค้า - Luna & Spiral</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="shop-container" style="max-width: 600px;">
        <div class="shop-header">
            <p class="handwritten">Craft Your Box</p>
            <h1>ระบบคำนวณและสั่งซื้อ</h1>
        </div>

        <form id="orderForm" style="background: var(--card-bg); padding: 30px; border-radius: 12px; border: 1px solid var(--border-color);">
            <div style="margin-bottom: 25px;">
                <label style="display: block; margin-bottom: 12px; font-weight: 600; font-family: var(--serif-font);">1. เลือกขนาดกล่อง:</label>
                <div style="display: flex; gap: 20px;">
                    <label><input type="radio" id="boxSize" name="boxSize" value="S" checked> ขนาด S (250.- / 3-5 ชิ้น)</label>
                    <label><input type="radio" id="boxSize" name="boxSize" value="M"> ขนาด M (390.- / 6-8 ชิ้น)</label>
                    <label><input type="radio" id="boxSize" name="boxSize" value="L"> ขนาด L (550.- / 9-12 ชิ้น)</label>
                </div>
            </div>

            <div style="margin-bottom: 25px;">
                <label style="display: block; margin-bottom: 12px; font-weight: 600; font-family: var(--serif-font);">2. เลือกหมวดสินค้า (เลือกอย่างน้อย 1 หมวด):</label>
                <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;">
                    <label><input type="checkbox" class="cat-checkbox" value="rope"> เชือก (x1.0)</label>
                    <label><input type="checkbox" class="cat-checkbox" value="bead"> ลูกปัด (x1.0)</label>
                    <label><input type="checkbox" class="cat-checkbox" value="silver"> เงิน (x1.3)</label>
                    <label><input type="checkbox" class="cat-checkbox" value="gold"> ทอง (x1.5)</label>
                </div>
            </div>

            <div style="margin-bottom: 25px; font-size: 1.3rem; font-family: var(--serif-font); border-top: 1px dashed var(--border-color); padding-top: 15px;">
                ราคารวมสุทธิ: <span id="totalPrice" style="color: var(--earth-brown); font-weight: bold;">0.00</span> บาท
            </div>

            <button type="submit" id="submitBtn" style="width: 100%; background-color: var(--olive-green); color: var(--card-bg); border: none; padding: 14px; border-radius: 8px; cursor: pointer; font-family: var(--serif-font); font-size: 1.1rem;">ยืนยันคำสั่งซื้อ ✦</button>
        </form>
    </div>

    <script>
        /**
         * HTML Element IDs and Selectors Reference:
         * - #boxSize         : <input type="radio"> elements for choosing box size ('S', 'M', 'L')
         * - .cat-checkbox    : Class for category checkboxes (Values: 'rope', 'bead', 'silver', 'gold')
         * - #totalPrice      : Element to display the real-time calculated price
         * - #orderForm       : <form> element
         * - #submitBtn       : <button> element for submission
         */
        const BASE_PRICES = { 'S': 250, 'M': 390, 'L': 550 };
        const CATEGORY_MULTIPLIERS = { 'rope': 1.0, 'bead': 1.0, 'silver': 1.3, 'gold': 1.5 };

        const boxSizeRadios = document.querySelectorAll('input[name="boxSize"]');
        const categoryCheckboxes = document.querySelectorAll('.cat-checkbox');
        const totalPriceDisplay = document.getElementById('totalPrice');
        const orderForm = document.getElementById('orderForm');
        const submitBtn = document.getElementById('submitBtn');

        function calculatePrice() {
            let selectedSize = 'S';
            boxSizeRadios.forEach(r => { if (r.checked) selectedSize = r.value; });
            const basePrice = BASE_PRICES[selectedSize] || 0;

            const checkedCategories = Array.from(categoryCheckboxes).filter(cb => cb.checked);

            if (checkedCategories.length === 0) {
                totalPriceDisplay.textContent = 'กรุณาเลือกอย่างน้อย 1 หมวด';
                submitBtn.disabled = true;
                submitBtn.style.opacity = '0.5';
                submitBtn.style.cursor = 'not-allowed';
                return { valid: false };
            }

            submitBtn.disabled = false;
            submitBtn.style.opacity = '1';
            submitBtn.style.cursor = 'pointer';

            let sumMultiplier = 0;
            checkedCategories.forEach(cb => {
                sumMultiplier += (CATEGORY_MULTIPLIERS[cb.value] || 1.0);
            });

            const avgMultiplier = sumMultiplier / checkedCategories.length;
            const finalPrice = basePrice * avgMultiplier;

            totalPriceDisplay.textContent = finalPrice.toFixed(2);
            return { valid: true, price: finalPrice, size: selectedSize, categories: checkedCategories.map(c => c.value), avgMultiplier };
        }

        boxSizeRadios.forEach(r => r.addEventListener('change', calculatePrice));
        categoryCheckboxes.forEach(cb => cb.addEventListener('change', calculatePrice));

        async function submitOrder(event) {
            if (event) event.preventDefault();
            const res = calculatePrice();
            if (!res.valid) return;

            const payload = {
                size: res.size,
                categories: res.categories,
                totalPrice: res.price
            };

            // บันทึกข้อมูลลง sessionStorage เพื่อนำไปแสดงหน้า thankyou.html
            sessionStorage.setItem('orderSummary', JSON.stringify(payload));

            // ตัวอย่าง URL Google Apps Script Web App สำหรับรับค่าไปบันทึก Google Sheet
            const url = "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL";

            try {
                // ส่งข้อมูลไป Google Sheet แบบฟอร์มปกติ (ไม่ใส่ header เอง)
                await fetch(url, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
            } catch (e) {
                console.log("Mock submission success or network note:", e);
            }

            window.location.href = "thankyou.html";
        }

        orderForm.addEventListener('submit', submitOrder);
        calculatePrice();
    </script>
</body>
</html>
