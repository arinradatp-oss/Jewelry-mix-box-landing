<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ขอบคุณสำหรับการสั่งซื้อ - Luna & Spiral</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="shop-container" style="max-width: 600px; text-align: center;">
        <div class="shop-header">
            <p class="handwritten">Thank You</p>
            <h1>สั่งซื้อสำเร็จแล้ว ✦</h1>
        </div>

        <div style="background: var(--card-bg); padding: 30px; border-radius: 12px; border: 1px solid var(--border-color); text-align: left; margin-bottom: 25px;">
            <h3 style="font-family: var(--serif-font); margin-top: 0; color: var(--olive-green); border-bottom: 1px dashed var(--border-color); padding-bottom: 10px;">สรุปรายการคำสั่งซื้อ</h3>
            <p><strong>ชื่อลูกค้า:</strong> <span id="summaryName">-</span></p>
            <p><strong>ช่องทางติดต่อ:</strong> <span id="summaryContact">-</span></p>
            <p><strong>ขนาดกล่อง:</strong> <span id="summarySize">-</span></p>
            <p><strong>หมวดสินค้าที่เลือก:</strong> <span id="summaryCategories">-</span></p>
            <p><strong>หมายเหตุ:</strong> <span id="summaryNote">-</span></p>
            <p><strong>ยอดชำระสุทธิ:</strong> <span id="summaryPrice" style="color: var(--earth-brown); font-weight: bold;">-</span> บาท</p>
        </div>

        <a href="index.html" style="display: inline-block; background-color: var(--olive-green); color: var(--card-bg); padding: 12px 25px; border-radius: 8px; text-decoration: none; font-family: var(--serif-font);">กลับไปหน้าสั่งซื้อ</a>
    </div>

    <script>
        const dataStr = sessionStorage.getItem('orderSummary');
        if (dataStr) {
            const data = JSON.parse(dataStr);
            document.getElementById('summaryName').textContent = data.customerName || '-';
            document.getElementById('summaryContact').textContent = data.contact || '-';
            document.getElementById('summarySize').textContent = data.boxSize ? `ขนาด ${data.boxSize}` : '-';
            document.getElementById('summaryCategories').textContent = data.categories || '-';
            document.getElementById('summaryNote').textContent = data.note || '-';
            document.getElementById('summaryPrice').textContent = Number(data.total).toFixed(2);
        }
    </script>
</body>
</html>
